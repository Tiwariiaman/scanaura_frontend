<!-- ==========================================================
     INITIAL LOADING SCREEN
     Prevents a blank/white screen while Flutter starts.
     ========================================================== -->

<div
        id="initial-loader"
        style="
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: Arial, sans-serif;
  "
>
  <div
          style="
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    "
  >

    <img
            src="icons/android-icon-192x192.png"
            width="72"
            height="72"
            alt="ScanAura"
            decoding="async"
    >

    <div
            style="
        font-size: 18px;
        font-weight: 700;
        color: #111827;
      "
    >
      ScanAura
    </div>

    <div
            style="
        width: 34px;
        height: 34px;
        border: 3px solid #e5e7eb;
        border-top-color: #111827;
        border-radius: 50%;
        animation: scanaura-spin 0.8s linear infinite;
      "
    ></div>

  </div>
</div>

<style>
  @keyframes scanaura-spin {
    to {
      transform: rotate(360deg);
    }
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
  }

  #initial-loader {
    transition: opacity 180ms ease;
  }
</style>

<!-- ==========================================================
     FLUTTER WEB
     ========================================================== -->

<script>
  window.addEventListener('flutter-first-frame', function () {
    const loader = document.getElementById('initial-loader');

    if (loader) {
      loader.style.opacity = '0';

      setTimeout(function () {
        loader.remove();
      }, 200);
    }
  });
</script>

<script

></script>
