name: Deploy Flutter Web to Hostinger

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter clean
          flutter build web \
            --release \
            --pwa-strategy=none \
            --dart-define=API_BASE_URL=https://api.scanaura.in \
            --no-wasm-dry-run

      - name: Remove legacy PWA files
        shell: bash
        run: |
          rm -f build/web/flutter_service_worker.js
          rm -f build/web/manifest.json
          rm -f build/web/service-worker.js
          rm -f build/web/sw.js

      - name: Add deployment version
        shell: bash
        env:
            BUILD_ID: ${{ github.sha }}
        run: |
            python3 - <<'PY'
            from pathlib import Path
            import os
            import re
            
            path = Path("build/web/index.html")
            text = path.read_text(encoding="utf-8")
            
            build_id = os.environ["BUILD_ID"]
            
            pattern = r'flutter_bootstrap\.js(?=["\'])'
            
            updated, count = re.subn(
                pattern,
                f"flutter_bootstrap.js?v={build_id}",
                text,
                count=1,
            )
            
            if count != 1:
                raise SystemExit(
                    "ERROR: Could not find flutter_bootstrap.js in build/web/index.html"
                )
            
            path.write_text(updated, encoding="utf-8")
            
            print(f"Deployment build ID: {build_id}")
            ```

      - name: Verify production build
        shell: bash
        run: |
          echo "Checking production build..."

          grep -a -q "api.scanaura.in" build/web/main.dart.js \
            || { echo "ERROR: Production API URL missing."; exit 1; }

          if grep -a -q "localhost:8080" build/web/main.dart.js; then
            echo "ERROR: localhost:8080 found in production build."
            exit 1
          fi

          if [ -f "build/web/flutter_service_worker.js" ]; then
            echo "ERROR: flutter_service_worker.js still exists."
            exit 1
          fi

          if [ -f "build/web/manifest.json" ]; then
            echo "ERROR: manifest.json still exists."
            exit 1
          fi

          echo "Production build verified."

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}

          local-dir: ./build/web/
          server-dir: ./public_html/

          state-name: .ftp-deploy-sync-state.json