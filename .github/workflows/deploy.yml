name: Deploy Flutter Web to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter clean
          flutter build web \
            --release \
            --pwa-strategy=none \
            --dart-define=API_BASE_URL=https://api.scanaura.in \
            --no-wasm-dry-run

      - name: Remove legacy PWA files
        shell: bash
        run: |
          rm -f build/web/flutter_service_worker.js
          rm -f build/web/manifest.json
          rm -f build/web/service-worker.js
          rm -f build/web/sw.js

      - name: Add deployment version
        shell: bash
        run: |
          set -e

          test -f build/web/index.html

          sed -i \
            "s#flutter_bootstrap\.js#flutter_bootstrap.js?v=${GITHUB_SHA}#" \
            build/web/index.html

          echo "Deployment build ID: ${GITHUB_SHA}"

          grep -a -q "flutter_bootstrap.js?v=${GITHUB_SHA}" build/web/index.html || {
            echo "ERROR: Failed to add deployment version."
            exit 1
          }

      - name: Verify production build
        shell: bash
        run: |
          set -e

          echo "Checking production build..."

          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/main.dart.js

          echo "Checking production API URL..."
          grep -a -q "api.scanaura.in" build/web/main.dart.js

          echo "Checking for localhost..."
          if grep -a -q "localhost:8080" build/web/main.dart.js; then
            echo "ERROR: localhost:8080 found in production build."
            exit 1
          fi

          echo "Checking PWA files..."

          if [ -f build/web/flutter_service_worker.js ]; then
            echo "ERROR: flutter_service_worker.js exists."
            exit 1
          fi

          if [ -f build/web/manifest.json ]; then
            echo "ERROR: manifest.json exists."
            exit 1
          fi

          if [ -f build/web/service-worker.js ]; then
            echo "ERROR: service-worker.js exists."
            exit 1
          fi

          if [ -f build/web/sw.js ]; then
            echo "ERROR: sw.js exists."
            exit 1
          fi

          echo "Production build verification passed."

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/web/
          server-dir: ./public_html/
          state-name: .ftp-deploy-sync-state.json